server.port=8080

spring.application.name=gateway-server

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=main-service
spring.cloud.gateway.routes[0].uri=lb://main-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/events/**
spring.cloud.gateway.routes[0].predicates[1]=Path=/categories/**
spring.cloud.gateway.routes[0].predicates[2]=Path=/compilations/**
spring.cloud.gateway.routes[0].predicates[3]=Path=/users/**
spring.cloud.gateway.routes[0].predicates[4]=Path=/admin/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/