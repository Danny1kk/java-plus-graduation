server.port=8080

spring.application.name=gateway-server

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=event-service
spring.cloud.gateway.routes[0].uri=lb://event-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/events/**, /events, /admin/events/**, /admin/events, /users/*/events/**, /users/*/events

spring.cloud.gateway.routes[1].id=category-service
spring.cloud.gateway.routes[1].uri=lb://category-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/categories/**, /categories, /admin/categories/**, /admin/categories

spring.cloud.gateway.routes[2].id=user-service
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/admin/users/**, /admin/users

spring.cloud.gateway.routes[3].id=compilation-service
spring.cloud.gateway.routes[3].uri=lb://compilation-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/compilations/**, /compilations, /admin/compilations/**, /admin/compilations

spring.cloud.gateway.routes[4].id=comment-service
spring.cloud.gateway.routes[4].uri=lb://comment-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/comments/**, /comments, /admin/comments/**, /admin/comments, /users/*/comments/**, /users/*/comments

spring.cloud.gateway.routes[5].id=request-service
spring.cloud.gateway.routes[5].uri=lb://request-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/users/*/requests/**, /users/*/requests, /users/*/events/*/requests/**, /users/*/events/*/requests

#spring.cloud.gateway.routes[6].id=stats-service
#spring.cloud.gateway.routes[6].uri=lb://stats-server
#spring.cloud.gateway.routes[6].predicates[0]=Path=/hit, /stats

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

